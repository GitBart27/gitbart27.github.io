/*-- scss:rules --*/
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap');

body { line-height: 1.6; }
main { max-width: 46rem; margin-inline: auto; }
.page-layout-full main { max-width: 58rem; }

.hero {
  font-family: $headings-font-family;
  font-size: clamp(2.2rem, 6vw, 4rem);
  line-height: 1.08;
  letter-spacing: -0.015em;
  max-width: 14ch;
  margin: 2.5rem 0 2rem;
}

.lead-block { max-width: 38rem; font-size: 1.1rem; }

.columns-3 {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(13rem, 1fr));
  gap: 2rem;
  margin-top: 3rem;
  padding-top: 1.5rem;
  border-top: 1px solid $border-color;
}
.columns-3 h3 { font-size: 1.25rem; margin-top: 0; }

.quarto-title-block .title { font-size: 2.4rem; }
a:focus-visible { outline: 2px solid $primary; outline-offset: 2px; }

#refs .csl-entry { margin-bottom: 1rem; }

